name: Test build

on:
  push:
    branches: [main, world-clock-widget, "fix/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # "Clock Test": a debug build with its own app id, installs next to the real Clock.
      - name: Build test APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: " build.log | head -20 | while read -r line; do echo "::error::$line"; done
          grep -E "FAILED|ERROR:" build.log | head -20 | while read -r line; do echo "::error::$line"; done

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Clock-test.apk

      # One "Clock Test build" DRAFT release, replaced on every push. A draft has no tag,
      # so F-Droid never sees it.
      - name: Publish test build (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api repos/$GITHUB_REPOSITORY/releases --jq '.[] | select(.draft and .name == "Clock Test build") | .id'); do
            gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/$id
          done
          gh release create "test-${GITHUB_SHA::7}" Clock-test.apk --draft \
            --target "$GITHUB_SHA" \
            --title "Clock Test build" \
            --notes "Test build of ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Installs as \"Clock Test\", next to the real Clock."
